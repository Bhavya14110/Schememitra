scheme_code: PM_VISHWAKARMA
apex_corp: MoMSME
version: 1
loan_type: micro_finance
name:
  en: PM Vishwakarma (first tranche)
  hi: पीएम विश्वकर्मा (पहली किस्त)
  bn: পিএম বিশ্বকর্মা (প্রথম কিস্তি)
  mr: पीएम विश्वकर्मा (पहिला हप्ता)
  te: పీఎం విశ్వకర్మ (మొదటి విడత)
  ta: பிஎம் விஸ்வகர்மா (முதல் தவணை)
  gu: પીએમ વિશ્વકર્મા (પ્રથમ હપ્તો)
  ur: پی ایم وشوکرما (پہلی قسط)
  kn: ಪಿಎಂ ವಿಶ್ವಕರ್ಮ (ಮೊದಲ ಕಂತು)
  or: ପିଏମ୍ ବିଶ୍ୱକର୍ମା (ପ୍ରଥମ କିସ୍ତି)
  ml: പിഎം വിശ്വകർമ്മ (ആദ്യ ഗഡു)
  pa: ਪੀਐਮ ਵਿਸ਼ਵਕਰਮਾ (ਪਹਿਲੀ ਕਿਸ਼ਤ)
  as: পিএম বিশ্বকৰ্মা (প্ৰথম কিস্তি)
source_url: https://pmvishwakarma.gov.in/
verified_on: 2026-10-11
needs_verification: false
notes: >
  Checked on pmvishwakarma.gov.in on 2026-10-11: artisans in 18 listed trades working with hands and
  tools, at least 18, one member per family, collateral-free Rs 1 lakh first tranche over 18 months
  (Rs 2 lakh second tranche over 30 months) at 5% to the beneficiary. Excluded: government employees and
  their families, and anyone who took PMEGP, PM SVANidhi or Mudra loans in the last 5 years - the bank
  and registration check these, we don't ask. Our intake has no 18-trade list, so tailoring and handicraft
  stand in for it; registration confirms the trade.
effective_from: 2026-10-11
params:
  min_age: 18
  trades: [tailoring, handicraft]
  max_loan_paise: 10000000
eligibility:
  - id: trade
    kind: custom
    logic: { in: [{ var: business_type }, { param: trades }] }
    fields: [business_type]
    pass_key: rules.c.trade_ok
    fail_key: rules.c.trade_fail
  - id: age
    kind: custom
    logic: { ">=": [{ var: age }, { param: min_age }] }
    fields: [age]
    pass_key: rules.c.age_min_ok
    fail_key: rules.c.age_min_fail
    sentence: { value: { var: age, type: number }, min: { param: min_age, type: number } }
  - { id: loan_amount, kind: loan_max }
documents_required:
  - { type: aadhaar, required: true }
  - { type: bank_passbook, required: true }
loan_limits: { min_paise: 0, max_paise: 10000000 }
funding_pattern: { apex_bps: 10000, partner_bps: 0, beneficiary_bps: 0 }
interest:
  slabs:
    - { upto_paise: 10000000, rate_bps: 500 }
moratorium: { default_months: 0, max_months: 0, treatment: interest_paid_monthly }
repayment: { default_tenure_months: 18, max_tenure_months: 18, frequency: monthly }
channel_partner_types: [PSB, RRB]
processing_days: 30
